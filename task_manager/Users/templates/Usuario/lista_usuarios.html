<h2>USUARIOS</h2>

<table>
    <thead>
        <tr>
            <th>name</th>
            <th>password</th>
            <th>email</th>
        </tr>

    </thead>
    <tbody>
        {% for item in usuarios %}
        <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.password }}</td>
            <td>{{ item.email }}</td>
        </tr>
        {% endfor %}  
    </tbody>
</table>
